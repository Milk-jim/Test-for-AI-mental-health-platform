[pytest]
# 测试路径
testpaths = api_tests ui_tests

# 测试文件命名规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行参数
addopts =
    -v
    -s
    --tb=short
    --strict-markers
    --alluredir=./allure-results
    --clean-alluredir

# 标记
markers =
    api: 接口测试
    ui: UI 测试
    smoke: 冒烟测试
    user: 用户模块
    knowledge: 知识科普模块
    emotion: 情绪记录模块
    chat: 聊天模块
    test_module: 心理测试模块
    settings: 系统设置模块

# 日志
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S